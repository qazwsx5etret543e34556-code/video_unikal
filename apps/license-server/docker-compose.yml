version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: video-uniqueizer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_uniqueizer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-uniqueizer-license-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/video_uniqueizer?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      OFFLINE_TOKEN_SECRET: ${OFFLINE_TOKEN_SECRET:-your-offline-token-secret-key-must-be-at-least-64-characters-long}
      OFFLINE_TOKEN_DAYS: 7
      ADMIN_IP_WHITELIST: ${ADMIN_IP_WHITELIST:-127.0.0.1,::1}
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3001:3001"
    volumes:
      - ./prisma:/app/prisma

volumes:
  postgres_data:
